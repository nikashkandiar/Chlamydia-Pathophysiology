    // ============================================================================
    // GLOSSARY DATA (Accessible via inline clickable pills & slide-out drawer)
    // ============================================================================
    const GLOSSARY_TERMS = [
      {
        term: "Obligate Intracellular Bacterium",
        phonetic: "ob-li-gate in-tra-cel-lu-lar",
        category: "The Pathogen",
        simplified: "A bacterium that cannot produce its own cellular energy and must enter a living host cell in order to survive and multiply.",
        science: "A pathogen that cannot replicate outside a host cell because it lacks metabolic pathways to synthesize ATP and essential metabolic intermediates, relying on host ATP/ADP translocases."
      },
      {
        term: "Cervical Ectopy (Immaturity)",
        phonetic: "ser-vi-kal ek-to-pee",
        category: "Healthy Physiology",
        simplified: "In women aged 15–25, the delicate single-layer cells that line the inner cervical canal are naturally exposed on the outer surface of the cervix, making it easier for bacteria to attach.",
        science: "A normal physiological state in adolescents and young adults where single-layer simple columnar epithelium of the endocervix extends onto the ectocervix, exposing prime receptor targets to Chlamydia trachomatis."
      },
      {
        term: "Elementary Body (EB)",
        phonetic: "el-uh-men-tuh-ree bod-ee",
        category: "The Pathogen",
        simplified: "The tough, infectious form of Chlamydia designed to survive outside of cells and attach to new host cells during transmission.",
        science: "The small (~0.3 µm), metabolically inactive, extracellular infectious form of Chlamydia trachomatis stabilized by disulfide-crosslinked outer membrane proteins."
      },
      {
        term: "Reticulate Body (RB)",
        phonetic: "ri-tik-yuh-lit bod-ee",
        category: "The Pathogen",
        simplified: "The active, multiplying form of Chlamydia inside the host cell that acts like an internal factory, rapidly duplicating itself using the cell's energy.",
        science: "The larger (~1.0 µm), non-infectious, metabolically active intracellular form that replicates rapidly by binary fission inside the inclusion vacuole."
      },
      {
        term: "Inclusion Vacuole",
        phonetic: "in-kloo-zhun vak-yoo-ohl",
        category: "Cellular Pathophysiology",
        simplified: "A protective microscopic bubble that Chlamydia builds around itself inside your cell so the cell's natural waste-disposal enzymes cannot destroy it.",
        science: "A specialized, membrane-bound intracellular compartment modified by bacterial Inc proteins to evade phagolysosomal fusion while intercepting host lipid vesicles and ATP."
      },
      {
        term: "Ciliated & Peg Cells",
        phonetic: "sil-ee-ay-tid & peg selz",
        category: "Healthy Physiology",
        simplified: "Specialized cells lining the fallopian tubes: ciliated cells have tiny hair-like projections that beat in waves to gently sweep the egg toward the uterus, while peg cells produce fluid that nourishes the egg.",
        science: "Ciliated columnar epithelial cells beat synchronously to propel the ovum toward the uterus, while non-ciliated secretory 'peg' cells produce nutrient-rich tubular fluid."
      },
      {
        term: "Extrusion vs. Lysis",
        phonetic: "eks-troo-zhun / ly-sis",
        category: "Cellular Pathophysiology",
        simplified: "Chlamydia's two exit strategies: pinching off in a small hidden membrane package without breaking the host cell (Extrusion) or causing the host cell to swell and burst open (Lysis).",
        science: "Two equally prevalent exit mechanisms: Extrusion pinches off membrane-wrapped bacteria leaving the host cell intact (delaying immune recognition), whereas Lysis enzymatically degrades host membranes."
      },
      {
        term: "DAMPs & TLRs",
        phonetic: "damps & tee-el-arz",
        category: "Clinical Link",
        simplified: "Cellular warning signals released when infected cells burst open, alerting immune receptors to recruit white blood cells and trigger local inflammation.",
        science: "Damage-Associated Molecular Patterns released by lysed host cells bind Toll-Like Receptors (TLRs) on immune and epithelial cells, initiating acute pro-inflammatory cytokine cascades."
      },
      {
        term: "TGF-β & Fibrosis",
        phonetic: "tee-jee-ef bay-tuh / fy-bro-sis",
        category: "Clinical Link",
        simplified: "When persistent inflammation signals tissue-repair cells (fibroblasts) to lay down thick, permanent collagen scar tissue that can narrow or block the fallopian tubes.",
        science: "Transforming Growth Factor-beta (TGF-β) released during chronic inflammation hyper-activates fibroblasts to deposit excessive extracellular matrix (ECM) and collagen, scarring the oviduct."
      }
    ];

    // ============================================================================

    const SciMark = ({ children, color = "rose" }) => {

    /**
     * Interactive 3D Flip-Flashcard Component
     * Front Face: Simplified Translation (Default)
     * Back Face: Granular Cellular & Molecular Mechanism
     */
    const FlipFlashcard = ({
      resetKey,
      frontTitle = "SIMPLIFIED TRANSLATION (PRIMARY OVERVIEW)",
      backTitle = "CELLULAR & MOLECULAR MECHANISM",
      frontContent,
      backContent,
    }) => {
      const [isFlipped, setIsFlipped] = useState(false);

      useEffect(() => {
        setIsFlipped(false);
      }, [resetKey]);

      return (
        <div className="space-y-2.5">
          {/* Top Flashcard Status & Flip Toggle Bar */}
          <div className="flex flex-wrap items-center justify-between gap-2 px-1">
            <div className="inline-flex items-center gap-2">
              <span
                className={`font-mono-editorial text-[10px] font-bold uppercase px-2.5 py-1 rounded-full border transition-colors ${

                    ? 'bg-amber-200/90 text-amber-950 border-amber-400'

              <span>{!isFlipped ? 'Flip to Cellular Mechanism' : 'Flip to Simplified Translation'}</span>

          {/* 3D Flipping Card Container */}

            role="button"
            tabIndex={0}

          >

                transformStyle: 'preserve-3d',

              <div
                style={{
                  backfaceVisibility: 'hidden',
                  WebkitBackfaceVisibility: 'hidden',
                }}
                className={`col-start-1 row-start-1 bg-gradient-to-br from-amber-50 via-[#FFFBEB] to-amber-100/70 border-2 border-amber-400 rounded-3xl p-6 shadow-[4px_4px_0px_0px_rgba(217,119,6,0.3)] group-hover:border-amber-500 transition-colors flex flex-col justify-between ${
                  isFlipped ? 'pointer-events-none' : ''
                }`}
              >
                <div className="space-y-3">
                  <div className="flex items-center justify-between gap-2 border-b border-amber-200/90 pb-3">
                    <div className="font-mono-editorial text-xs font-bold uppercase text-amber-950 flex items-center gap-1.5">
                      <Sparkles size={15} className="text-amber-700 shrink-0" />
                      <span>{frontTitle}</span>
                    </div>
                    <span className="font-mono-editorial text-[10px] font-bold uppercase bg-white/90 text-amber-900 px-2.5 py-0.5 rounded-full border border-amber-300">
                      Side A • Plain Language
                    </span>
                  </div>

                  <div className="text-base sm:text-lg text-stone-800 leading-relaxed font-medium pt-1">
                    {frontContent}
                  </div>
                </div>

                <div className="mt-6 pt-3 border-t border-amber-200/80 flex items-center justify-between text-xs font-mono-editorial text-amber-900 font-bold">
                  <span>CLICK CARD TO FLIP FOR MOLECULAR MECHANISMS</span>
                  <span className="inline-flex items-center gap-1 bg-amber-200/80 group-hover:bg-amber-300 text-amber-950 px-3 py-1 rounded-full transition-colors">
                    <RefreshCw size={12} /> Flip Card →
                  </span>
                </div>

              {/* BACK FACE: GRANULAR CELLULAR & MOLECULAR MECHANISMS */}

                  <span className="inline-flex items-center gap-1 bg-purple-100 group-hover:bg-purple-200 text-purple-950 px-3 py-1 rounded-full border border-purple-300 transition-colors">

    // ============================================================================
    // SUB-COMPONENT: CHAPTER 05 SIMPLIFIED KNOWLEDGE CHECK QUIZ
    // ============================================================================
    function QuizSection({ quizAnswers, setQuizAnswers, quizSubmitted, setQuizSubmitted }) {
      const questions = [
        {
          id: 'q1',
          question: "1. What is the normal role of ciliated cells and peg cells in a healthy fallopian tube?",
          options: [
            { id: 'a', text: "Ciliated cells beat in waves to sweep the egg toward the uterus, while peg cells nourish it." },
            { id: 'b', text: "They produce scar tissue to block bacteria from entering the uterus." },
            { id: 'c', text: "They break down the outer surface of the cervix." }
          ],
          correct: 'a',
          explanation: "Correct. Healthy ciliated epithelial cells beat in coordinated waves to gently move the ovum toward the uterus, while secretory peg cells provide nutrient-rich fluid."
        },
        {
          id: 'q2',
          question: "2. Why must Chlamydia trachomatis enter a host cell to multiply?",
          options: [
            { id: 'a', text: "It is an obligate intracellular bacterium that cannot produce its own energy (ATP)." },
            { id: 'b', text: "It only infects red blood cells in the bloodstream." },
            { id: 'c', text: "It can multiply freely on its own without human cells." }
          ],
          correct: 'a',
          explanation: "Correct. As an obligate intracellular bacterium, Chlamydia enters the cell as an infectious Elementary Body (EB) and transforms into a Reticulate Body (RB) inside an inclusion bubble to replicate using the host cell's energy."
        },
        {
          id: 'q3',
          question: "3. Why do 70–80% of women with Chlamydia experience no early symptoms?",
          options: [
            { id: 'a', text: "The bacteria hide inside an intracellular bubble and can exit via extrusion without bursting the host cell." },
            { id: 'b', text: "The bacteria release pain-numbing chemicals into the nerves." },
            { id: 'c', text: "The immune system clears the bacteria within a few hours." }
          ],
          correct: 'a',
          explanation: "Correct. By hiding inside the inclusion vacuole, inhibiting premature cell death, and escaping in membrane packages (extrusion) that leave the host cell intact, Chlamydia avoids immediately triggering pain receptors."
        },
        {
          id: 'q4',
          question: "4. How does an untreated Chlamydia infection lead to infertility or ectopic pregnancy?",
          options: [
            { id: 'a', text: "Persistent inflammation destroys fallopian tube cilia and triggers fibroblasts to form permanent scar tissue (fibrosis) that blocks the tube." },
            { id: 'b', text: "The bacteria permanently stop the ovaries from releasing eggs." },
            { id: 'c', text: "The cervical mucus barrier becomes permanently thinned." }
          ],
          correct: 'a',
          explanation: "Correct. Chronic inflammatory signals (like TNF-α and TGF-β) destroy the wave-beating cilia and activate fibroblasts to lay down thick collagen scar tissue, blocking sperm or trapping a fertilized egg in the fallopian tube."
        }
      ];

      const handleSelect = (qId, optId) => {
        if (quizSubmitted) return;
        setQuizAnswers({ ...quizAnswers, [qId]: optId });
      };

      const score = questions.reduce((acc, q) => (quizAnswers[q.id] === q.correct ? acc + 1 : acc), 0);
      const allAnswered = Object.keys(quizAnswers).length === questions.length;

      return (
        <div className="bg-gradient-to-br from-[#FFE5EC]/60 via-[#FFFDF9] to-[#EDE9FE]/60 rounded-[2rem] border-2 border-stone-800 p-6 sm:p-8 shadow-[6px_6px_0px_0px_rgba(28,25,23,0.9)] space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <p className="text-stone-700 text-sm sm:text-base font-medium">
              Select the best answer for each of the 4 questions below to review the key concepts:
            </p>
            {quizSubmitted && (
              <div className="bg-stone-900 text-amber-300 font-mono-editorial text-xs font-bold px-4 py-1.5 rounded-full">
                SCORE: {score} / {questions.length}
              </div>
            )}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {questions.map((q) => {

                  <QuizSection
                    quizAnswers={quizAnswers}
                    setQuizAnswers={setQuizAnswers}
                    quizSubmitted={quizSubmitted}
                    setQuizSubmitted={setQuizSubmitted}
                  />
                </article>

              </main>
            </div>
          </div>

          {/* SLIDE-OUT SCIENTIFIC GLOSSARY DRAWER */}
          {glossaryOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-stone-900/50 backdrop-blur-xs">
              <div className="w-full max-w-md bg-[#FFFDF9] h-full shadow-2xl border-l-2 border-stone-900 flex flex-col justify-between overflow-hidden">
                <div className="p-5 bg-stone-900 text-white flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Microscope size={18} className="text-purple-400" />
                    <div>
                      <h3 className="font-serif-editorial text-lg font-bold">Scientific Glossary</h3>
                      <p className="font-mono-editorial text-[10px] text-stone-300 uppercase">
                        Simplified & Cellular Definitions
                      </p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setGlossaryOpen(false)}
                    className="p-1.5 rounded-full bg-stone-800 hover:bg-stone-700 text-stone-300 hover:text-white cursor-pointer"
                  >
                    <X size={18} />
                  </button>
                </div>

                <div className="p-4 border-b border-stone-200 bg-[#FAF6F0]">
                  <div className="relative">
                    <Search size={15} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400" />
                    <input
                      type="text"
                      value={glossarySearch}
                      onChange={(e) => setGlossarySearch(e.target.value)}
                      placeholder="Search a cell type, stage, or term..."
                      className="w-full pl-9 pr-8 py-2 rounded-xl bg-white border border-stone-300 text-sm focus:outline-none focus:border-purple-600"
                    />
                    {glossarySearch && (
                      <button
                        type="button"
                        onClick={() => setGlossarySearch('')}
                        className="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-stone-400 hover:text-stone-700 cursor-pointer"
                      >
                        Clear
                      </button>
                    )}
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                  {GLOSSARY_TERMS.filter(item =>
                    item.term.toLowerCase().includes(glossarySearch.toLowerCase()) ||
                    item.simplified.toLowerCase().includes(glossarySearch.toLowerCase()) ||
                    item.science.toLowerCase().includes(glossarySearch.toLowerCase())
                  ).map((item, idx) => {
                    const isHighlighted = selectedGlossaryTerm === item.term;
                    return (
                      <div
                        key={idx}
                        className={`p-4 rounded-2xl border transition-all ${
                          isHighlighted
                            ? 'bg-purple-50 border-2 border-purple-500 shadow-xs'
                            : 'bg-white border-stone-200'
                        }`}
                      >
                        <div className="flex items-center justify-between gap-2 mb-1">
                          <span className="font-mono-editorial text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-stone-100 text-stone-700">
                            {item.category}
                          </span>
                          <span className="font-mono-editorial text-[10px] text-stone-400 italic">
                            /{item.phonetic}/
                          </span>
                        </div>
                        <h4 className="font-serif-editorial text-lg font-bold text-stone-900">
                          {item.term}
                        </h4>
                        <div className="mt-2 p-2.5 rounded-xl bg-amber-50 border border-amber-200 text-xs text-stone-800 leading-relaxed">
                          <strong className="text-amber-950">Simplified Overview:</strong> {item.simplified}
                        </div>
                        <div className="mt-2 text-xs text-stone-600 leading-relaxed">
                          <strong className="text-stone-800">Cellular Mechanism:</strong> {item.science}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="p-4 border-t border-stone-200 bg-[#FAF6F0] text-center">
                  <button
                    type="button"
                    onClick={() => setGlossaryOpen(false)}
                    className="w-full py-2.5 rounded-xl bg-stone-900 text-white font-mono-editorial text-xs font-bold uppercase hover:bg-stone-800 cursor-pointer"
                  >
                    Return to Article
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
