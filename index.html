    // ============================================================================
    // 2. MATHEMATICAL & GEOMETRIC VECTOR HELPERS (Pause-Safe RAF Clock)
    // ============================================================================
    const smoothstep = (min, max, value) => {
      const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
      return x * x * (3 - 2 * x);
    };

    function useAnimationClock(isPaused = false) {
      const [time, setTime] = useState(0);
      const elapsedRef = useRef(0);

      useEffect(() => {
        if (isPaused) return;
        let rafId;
        const start = performance.now() - elapsedRef.current * 1000;

        const tick = (now) => {
          const next = (now - start) / 1000;
          elapsedRef.current = next;
          setTime(next);
          rafId = requestAnimationFrame(tick);
        };

        rafId = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafId);
      }, [isPaused]);

      return time;
    }

    function buildVerticalMetaballCellPath(cx, cy, r, topIndent = 0, bottomBulge = 0, pinchNarrow = 0) {
      const pts = 24;
      const coords = [];

      for (let i = 0; i !== pts; i++) {
        const angle = (i * 2 * Math.PI) / pts;
        const dTop = Math.atan2(Math.sin(angle + Math.PI / 2), Math.cos(angle + Math.PI / 2));
        const topDeform = -topIndent * Math.exp(-(dTop * dTop) / 0.11);
        const topLip = topIndent * 0.22 * Math.exp(-((Math.abs(dTop) - 0.48) ** 2) / 0.05);

        const dBot = Math.atan2(Math.sin(angle - Math.PI / 2), Math.cos(angle - Math.PI / 2));
        const botDeform = bottomBulge * Math.exp(-(dBot * dBot) / 0.13);
        const botNeck = -pinchNarrow * Math.exp(-((Math.abs(dBot) - 0.36) ** 2) / 0.04);

        const rad = r + topDeform + topLip + botDeform + botNeck;
        coords.push({ x: cx + Math.cos(angle) * rad, y: cy + Math.sin(angle) * rad });
      }

      let d = `M ${coords[0].x.toFixed(2)} ${coords[0].y.toFixed(2)} `;
      for (let i = 0; i !== pts; i++) {
        const p0 = coords[(i - 1 + pts) % pts];
        const p1 = coords[i];
        const p2 = coords[(i + 1) % pts];
        const p3 = coords[(i + 2) % pts];

        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;

        d += `C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} `;
      }
      return d + "Z";
    }

    function buildHourglassNeckPath(cx, yTop, yBot, topHalfWidth, botHalfWidth, waistFactor) {
      const yMid = (yTop + yBot) * 0.5;
      const waist = Math.max(1.5, Math.min(topHalfWidth, botHalfWidth) * waistFactor);
      return [
        `M ${(cx - topHalfWidth).toFixed(2)} ${yTop.toFixed(2)}`,
        `C ${(cx - topHalfWidth).toFixed(2)} ${yMid.toFixed(2)}, ${(cx - waist).toFixed(2)} ${yMid.toFixed(2)}, ${(cx - botHalfWidth).toFixed(2)} ${yBot.toFixed(2)}`,
        `L ${(cx + botHalfWidth).toFixed(2)} ${yBot.toFixed(2)}`,
        `C ${(cx + waist).toFixed(2)} ${yMid.toFixed(2)}, ${(cx + topHalfWidth).toFixed(2)} ${yMid.toFixed(2)}, ${(cx + topHalfWidth).toFixed(2)} ${yTop.toFixed(2)}`,
        "Z"
      ].join(" ");
    }

    function buildMorphingTissueCellPath(cx, cy, baseR, swellProgress, scarProgress, seed = 0) {
      const vertices = 6;
      const radius = baseR * (1 + 0.24 * swellProgress - 0.18 * scarProgress);
      const handleTension = 1 - scarProgress;

      const pts = [];
      for (let i = 0; i !== vertices; i++) {
        const angle = (i * 2 * Math.PI) / vertices + seed * 0.35;
        const swellLobe = swellProgress * 3.5 * Math.sin(angle * 2 + seed);
        const scarFacet = scarProgress * (i % 2 === 0 ? 4.5 : -3.5);
        const r = radius + swellLobe + scarFacet;

        const updateBar = () => {
          if (barRef.current) {
            const total = document.documentElement.scrollHeight - window.innerHeight;
            const scale = total > 0 ? Math.min(1, Math.max(0, window.scrollY / total)) : 0;
            barRef.current.style.transform = `scaleX(${scale})`;

          ticking = false;
        };

        const onScroll = () => {
          if (!ticking) {
            window.requestAnimationFrame(updateBar);
            ticking = true;
          }
        };

        updateBar();
        return () => window.removeEventListener('scroll', onScroll);

              {/* Interactive Reading Legend Bar */}
              <div className="p-4 bg-white/90 border border-stone-900 flex flex-wrap items-center justify-between gap-4 text-xs text-stone-700">
                <div className="space-y-1">
                  <div className="font-bold uppercase tracking-widest text-[10px] text-stone-900">

                  <div className="flex flex-wrap items-center gap-x-4 gap-y-1.5 text-xs">

                      1. Click any <span className="glossary-term-chip pointer-events-none"><IconBook size={11} /><span>Term</span><span className="glossary-chip-badge">Define</span></span> button to open its glossary definition.
                    </span>
                    <span>
                      2. Flip any card to <strong>Side B</strong> for cellular science.
                    </span>

                </div>
                <button
                  type="button"
                  onClick={() => scrollToSection('ch1')}

                  Start Reading ↓
                </button>
              </div>

          {/* SINGLE-COLUMN LINEAR READING STREAM (max-w-3xl — One Focus at a Time) */}
          <main id="main-content" className="editorial-content-shell max-w-3xl mx-auto px-4 sm:px-6 py-14 space-y-20">

            {/* CHAPTER 01: OVERVIEW & SINGAPORE EPIDEMIOLOGY */}
            <article id="ch1" className="scroll-mt-28 space-y-6">
              <div className="border-b-2 border-stone-900 pb-3">
                <span className="text-[11px] font-bold uppercase tracking-[0.18em] text-rose-800 block mb-1">
                  PART 01 // EPIDEMIOLOGY &amp; SUSCEPTIBILITY
                </span>
                <h2 className="font-serif-display text-2xl sm:text-3xl lg:text-4xl font-bold text-stone-900 leading-tight">
                  Why Ages 15–25 Face the Highest Biological Risk
                </h2>
              </div>

              <div className="space-y-5 text-base sm:text-[17px] text-stone-800 leading-relaxed">
                <p className="drop-cap">
                  Most of us assume that if we caught a sexually transmitted infection, our bodies would let us know right away with pain or discomfort. In <strong>Singapore</strong>, data from the Communicable Diseases Agency (CDA) shows that Chlamydia is the <SciHighlight tone="rose">#1 most common legally notifiable STI at 91.1 cases per 100,000 people</SciHighlight>—ahead of both gonorrhoea and syphilis.
                </p>

                <p>
                  Doctors call Chlamydia a <strong>“silent” infection</strong> because in <SciHighlight tone="amber">70% to 80% of women, it causes zero early symptoms</SciHighlight>. The bacteria can live inside the cells of your reproductive tract for months without a single outward clue, while quietly driving internal inflammation.
                </p>

                <div className="grid grid-cols-1 sm:grid-cols-3 bg-[#23191E] text-white editorial-frame my-6 divide-y sm:divide-y-0 sm:divide-x divide-stone-700">
                  <div className="p-5">
                    <div className="text-[10px] font-bold uppercase tracking-widest text-rose-400">Singapore CDA Rate</div>
                    <div className="font-serif-display text-3xl font-bold text-white tabular-nums mt-1">91.1 <span className="text-xs font-normal text-stone-300">/ 100k</span></div>
                    <div className="text-xs text-stone-300 mt-1">#1 most common reportable STI</div>
                  </div>
                  <div className="p-5">
                    <div className="text-[10px] font-bold uppercase tracking-widest text-amber-300">Silent Cases</div>
                    <div className="font-serif-display text-3xl font-bold text-white tabular-nums mt-1">70–80%</div>
                    <div className="text-xs text-stone-300 mt-1">Of women feel zero early symptoms</div>
                  </div>
                  <div className="p-5">
                    <div className="text-[10px] font-bold uppercase tracking-widest text-rose-400">Peak Risk Window</div>
                    <div className="font-serif-display text-3xl font-bold text-white tabular-nums mt-1">Ages 15–25</div>
                    <div className="text-xs text-stone-300 mt-1">Due to natural cervical maturity</div>
                  </div>
                </div>

                <p>
                  Why are young women aged <strong>15 to 25</strong> affected the most? Beyond dating or social factors, the biggest reason is anatomy: during your teens and early twenties, your cervix is still finishing its growth—a normal stage called <TermButton term="Cervical Ectopy (Immaturity)" label="Cervical Immaturity (Ectopy)" onOpenGlossary={handleOpenGlossary} />. Because the outer surface of the cervix hasn’t finished growing its tough, multi-layered armor yet, delicate single-layer cells from the inner canal sit exposed on the outside, giving <em>Chlamydia trachomatis</em> an easy place to attach.
                </p>
              </div>

              <FluidCellularAnimation />

              <MagazinePullQuote
                quote="Waiting for physical symptoms before getting tested misses nearly 3 out of 4 Chlamydia infections in young women."
                attribution="SINGAPORE EPIDEMIOLOGICAL & CLINICAL REVIEW"
              />

              <AnatomicalBridgeMap />
            </article>

            <Chapter2Physiology onOpenGlossary={handleOpenGlossary} />
            <Chapter3Cycle onOpenGlossary={handleOpenGlossary} />
            <Chapter4Pathology onOpenGlossary={handleOpenGlossary} />
            <QuizSection />

              <div

                  <div>
                    <div className="text-[10px] font-bold uppercase tracking-[0.18em] text-amber-300">

                </div>

                <div className="p-4 border-b border-stone-300 bg-[#F2ECE4]">
                  <label htmlFor="glossary-search-input" className="sr-only">

                  <div className="relative">
                    <IconSearch size={15} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-500" />
                    <input

                <div className="flex-1 overflow-y-auto p-4 space-y-3">

                    return (

                                Selected Term
                              </span>
                            )}
                          </div>
                          <span className="text-xs text-stone-500 italic">
                            /{item.phonetic}/
                          </span>
                        </div>
                        <h3 className="font-serif-display text-lg font-bold text-stone-900 leading-snug">
                          {item.term}
                        </h3>
                        <div className="text-xs font-bold text-rose-800 mt-0.5 mb-3">
                          {item.subtitle}
                        </div>
                        <div className="p-3.5 bg-[#FFFBEB] border-l-4 border-l-amber-600 border border-amber-300 text-xs text-stone-800 leading-relaxed mb-3">

              </div>
            </div>

        </div>

    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
