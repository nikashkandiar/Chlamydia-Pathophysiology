    // ============================================================================
    // 2. MATHEMATICAL & GEOMETRIC VECTOR HELPERS (Pause-Safe RAF Clock)

    const smoothstep = (min, max, value) => {
      const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
      return x * x * (3 - 2 * x);
    };

    function useAnimationClock(isPaused = false) {
      const [time, setTime] = useState(0);
      const elapsedRef = useRef(0);

      useEffect(() => {
        if (isPaused) return;
        let rafId;
        const start = performance.now() - elapsedRef.current * 1000;

        const tick = (now) => {
          const next = (now - start) / 1000;
          elapsedRef.current = next;
          setTime(next);
          rafId = requestAnimationFrame(tick);
        };

        rafId = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafId);
      }, [isPaused]);

      return time;
    }

    function buildVerticalMetaballCellPath(cx, cy, r, topIndent = 0, bottomBulge = 0, pinchNarrow = 0) {
      const pts = 24;
      const coords = [];

      for (let i = 0; i !== pts; i++) {
        const angle = (i * 2 * Math.PI) / pts;
        const dTop = Math.atan2(Math.sin(angle + Math.PI / 2), Math.cos(angle + Math.PI / 2));
        const topDeform = -topIndent * Math.exp(-(dTop * dTop) / 0.11);
        const topLip = topIndent * 0.22 * Math.exp(-((Math.abs(dTop) - 0.48) ** 2) / 0.05);

        const dBot = Math.atan2(Math.sin(angle - Math.PI / 2), Math.cos(angle - Math.PI / 2));
        const botDeform = bottomBulge * Math.exp(-(dBot * dBot) / 0.13);
        const botNeck = -pinchNarrow * Math.exp(-((Math.abs(dBot) - 0.36) ** 2) / 0.04);

        const rad = r + topDeform + topLip + botDeform + botNeck;
        coords.push({ x: cx + Math.cos(angle) * rad, y: cy + Math.sin(angle) * rad });
      }

      let d = `M ${coords[0].x.toFixed(2)} ${coords[0].y.toFixed(2)} `;
      for (let i = 0; i !== pts; i++) {
        const p0 = coords[(i - 1 + pts) % pts];
        const p1 = coords[i];
        const p2 = coords[(i + 1) % pts];
        const p3 = coords[(i + 2) % pts];

        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;

        d += `C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} `;
      }
      return d + "Z";
    }

    function buildHourglassNeckPath(cx, yTop, yBot, topHalfWidth, botHalfWidth, waistFactor) {
      const yMid = (yTop + yBot) * 0.5;
      const waist = Math.max(1.5, Math.min(topHalfWidth, botHalfWidth) * waistFactor);
      return [

        const scarFacet = scarProgress * (i % 2 === 0 ? 4.5 : -3.5);
        const r = radius + swellLobe + scarFacet;
        pts.push({ x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r });
      }

      let d = `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)} `;
      for (let i = 0; i !== vertices; i++) {
        const p0 = pts[(i - 1 + vertices) % vertices];

        const p2 = pts[(i + 1) % vertices];
        const p3 = pts[(i + 2) % vertices];

        const cp1x = p1.x + ((p2.x - p0.x) / 6) * handleTension;
        const cp1y = p1.y + ((p2.y - p0.y) / 6) * handleTension;
        const cp2x = p2.x - ((p3.x - p1.x) / 6) * handleTension;
        const cp2y = p2.y - ((p3.y - p1.y) / 6) * handleTension;

    // ============================================================================
    // ZERO-RE-RENDER SCROLL PROGRESS BAR
    // ============================================================================
    const ReadingProgressBar = memo(() => {
      const barRef = useRef(null);

      useEffect(() => {
        let ticking = false;
        const updateBar = () => {
          if (barRef.current) {
            const total = document.documentElement.scrollHeight - window.innerHeight;
            const scale = total > 0 ? Math.min(1, Math.max(0, window.scrollY / total)) : 0;
            barRef.current.style.transform = `scaleX(${scale})`;
          }
          ticking = false;
        };

        const onScroll = () => {
          if (!ticking) {
            window.requestAnimationFrame(updateBar);
            ticking = true;
          }
        };

        window.addEventListener('scroll', onScroll, { passive: true });
        updateBar();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      return (
        <div aria-hidden="true" className="w-full h-1 bg-stone-200 overflow-hidden">
          <div
            ref={barRef}
            style={{ transform: 'scaleX(0)', transformOrigin: '0% 50%', willChange: 'transform' }}
            className="h-full w-full bg-rose-700"
          />

                      </p>

                      <p>

                      </p>

                      <p>
                        Why are young women aged <strong>15 to 25</strong> affected the most? Beyond dating or lifestyle factors, the reason is biological: during your teens and early twenties, your cervix is still maturing—a natural stage called <TermButton term="Cervical Ectopy (Immaturity)" label="Cervical Immaturity (Ectopy)" onOpenGlossary={handleOpenGlossary} />. Because the outer surface of the cervix hasn’t finished growing its tough, multi-layered armor yet, delicate single-layer cells from the inner canal sit exposed on the outside, giving <em>Chlamydia trachomatis</em> an easy landing pad.
                      </p>
