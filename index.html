    // ============================================================================
    // MATHEMATICAL & GEOMETRIC VECTOR HELPERS
    // ============================================================================
    const smoothstep = (min, max, value) => {
      const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
      return x * x * (3 - 2 * x);
    };

    function buildVerticalMetaballCellPath(cx, cy, r, topIndent = 0, bottomBulge = 0, pinchNarrow = 0) {
      const pts = 24;
      const coords = [];

      for (let i = 0; i !== pts; i++) {
        const angle = (i * 2 * Math.PI) / pts;

        const dTop = Math.atan2(Math.sin(angle + Math.PI / 2), Math.cos(angle + Math.PI / 2));
        const topDeform = -topIndent * Math.exp(-(dTop * dTop) / 0.11);
        const topLip = topIndent * 0.22 * Math.exp(-((Math.abs(dTop) - 0.48) ** 2) / 0.05);

        const dBot = Math.atan2(Math.sin(angle - Math.PI / 2), Math.cos(angle - Math.PI / 2));
        const botDeform = bottomBulge * Math.exp(-(dBot * dBot) / 0.13);
        const botNeck = -pinchNarrow * Math.exp(-((Math.abs(dBot) - 0.36) ** 2) / 0.04);

        const rad = r + topDeform + topLip + botDeform + botNeck;
        coords.push({
          x: cx + Math.cos(angle) * rad,
          y: cy + Math.sin(angle) * rad
        });
      }

      let d = `M ${coords[0].x.toFixed(2)} ${coords[0].y.toFixed(2)} `;
      for (let i = 0; i !== pts; i++) {
        const p0 = coords[(i - 1 + pts) % pts];
        const p1 = coords[i];
        const p2 = coords[(i + 1) % pts];
        const p3 = coords[(i + 2) % pts];

        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;

        d += `C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} `;
      }
      return d + "Z";
    }

    function buildHourglassNeckPath(cx, yTop, yBot, topHalfWidth, botHalfWidth, waistFactor) {
      const yMid = (yTop + yBot) * 0.5;
      const waist = Math.max(1.5, Math.min(topHalfWidth, botHalfWidth) * waistFactor);
      return [
        `M ${(cx - topHalfWidth).toFixed(2)} ${yTop.toFixed(2)}`,
        `C ${(cx - topHalfWidth).toFixed(2)} ${yMid.toFixed(2)}, ${(cx - waist).toFixed(2)} ${yMid.toFixed(2)}, ${(cx - botHalfWidth).toFixed(2)} ${yBot.toFixed(2)}`,
        `L ${(cx + botHalfWidth).toFixed(2)} ${yBot.toFixed(2)}`,
        `C ${(cx + waist).toFixed(2)} ${yMid.toFixed(2)}, ${(cx + topHalfWidth).toFixed(2)} ${yMid.toFixed(2)}, ${(cx + topHalfWidth).toFixed(2)} ${yTop.toFixed(2)}`,
        "Z"
      ].join(" ");
    }

    function buildMorphingTissueCellPath(cx, cy, baseR, swellProgress, scarProgress, seed = 0) {
      const vertices = 6;
      const radius = baseR * (1 + 0.24 * swellProgress - 0.18 * scarProgress);
      const handleTension = 1 - scarProgress;

      const pts = [];
      for (let i = 0; i !== vertices; i++) {
        const angle = (i * 2 * Math.PI) / vertices + seed * 0.35;
        const swellLobe = swellProgress * 3.5 * Math.sin(angle * 2 + seed);
        const scarFacet = scarProgress * (i % 2 === 0 ? 4.5 : -3.5);
        const r = radius + swellLobe + scarFacet;
        pts.push({
          x: cx + Math.cos(angle) * r,
          y: cy + Math.sin(angle) * r
        });
      }

      let d = `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)} `;
      for (let i = 0; i !== vertices; i++) {
        const p0 = pts[(i - 1 + vertices) % vertices];
        const p1 = pts[i];
        const p2 = pts[(i + 1) % vertices];
        const p3 = pts[(i + 2) % vertices];

        const cp1x = p1.x + ((p2.x - p0.x) / 6) * handleTension;
        const cp1y = p1.y + ((p2.y - p0.y) / 6) * handleTension;
        const cp2x = p2.x - ((p3.x - p1.x) / 6) * handleTension;
        const cp2y = p2.y - ((p3.y - p1.y) / 6) * handleTension;

        d += `C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} `;
      }
      return d + "Z";
    }

    function buildWarpedGridLine(isVertical, fixedCoord, maxSpan, attractors, scarTension) {
      const steps = 16;
      let d = "";
      for (let i = 0; i !== steps + 1; i++) {
        const t = (i / steps) * maxSpan;
        let x = isVertical ? fixedCoord : t;
        let y = isVertical ? t : fixedCoord;

        if (scarTension > 0.01) {
          let dxTotal = 0;
          let dyTotal = 0;
          for (let a = 0; a !== attractors.length; a++) {
            const att = attractors[a];
            const dx = att.x - x;
            const dy = att.y - y;
            const distSq = dx * dx + dy * dy;
            const pull = scarTension * 0.34 * Math.exp(-distSq / 5200);
            dxTotal += dx * pull;
            dyTotal += dy * pull;
          }
          x += dxTotal;
          y += dyTotal;
        }
        d += (i === 0 ? "M " : "L ") + `${x.toFixed(2)} ${y.toFixed(2)} `;
      }
      return d;
    }

    function useAnimationClock(isPaused = false) {

        let ticking = false;
        const updateBar = () => {
          if (barRef.current) {
            const total = document.documentElement.scrollHeight - window.innerHeight;
            const scale = total > 0 ? Math.min(1, Math.max(0, window.scrollY / total)) : 0;
            barRef.current.style.transform = `scaleX(${scale})`;
          }
          ticking = false;
        };

        const onScroll = () => {
          if (!ticking) {
            window.requestAnimationFrame(updateBar);
            ticking = true;
          }
        };

        window.addEventListener('scroll', onScroll, { passive: true });
        updateBar();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

        <div aria-hidden="true" className="w-full h-1 bg-stone-200 overflow-hidden">
          <div

                      >
                        <div className="flex items-center justify-between gap-2 mb-2">
                          <span className={`text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-sm border ${item.badgeColor}`}>
                            {item.category}
                          </span>
                          <span className="text-xs text-stone-500 italic">
                            /{item.phonetic}/
                          </span>
                        </div>
                        <h3 className="font-serif-display text-lg font-bold text-stone-900 leading-snug">
                          {item.term}
                        </h3>
                        <div className="text-xs font-bold text-rose-800 mt-0.5 mb-3">
                          {item.subtitle}
                        </div>
                        <div className="p-3.5 rounded-sm bg-[#FFFBEB] border border-amber-300 text-xs text-stone-800 leading-relaxed mb-3">
                          <strong className="text-amber-950 uppercase tracking-wider block mb-1 text-[10px]">
                            In Plain English
                          </strong>
                          {item.simplified}
                        </div>
                        <div className="text-xs text-stone-700 leading-relaxed">
                          <strong className="text-purple-950 uppercase tracking-wider block mb-1 text-[10px]">
                            Cellular Mechanism
                          </strong>
                          {item.science}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="p-4 border-t border-stone-300 bg-[#F6F2EC]">
                  <button
                    type="button"
                    onClick={() => setGlossaryOpen(false)}
                    className="w-full py-3 rounded-sm bg-[#161320] text-white text-xs font-bold uppercase tracking-wider hover:bg-stone-800 cursor-pointer"
                  >
                    Return to Guide
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
